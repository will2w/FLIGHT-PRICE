name: Automated Flight Scraper

on:
  schedule:
    - cron: '0 8 * * *' # 每天早上 8 點自動執行一次
  workflow_dispatch: # 支援手動點擊立刻執行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予自動寫入與 Commit 的權限
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件與 Playwright
        run: |
          pip install requests playwright
          playwright install chromium

      - name: 執行爬蟲腳本生成/更新資料庫
        run: python flight_radar_smart.py

      - name: 自動將最新資料庫 Commit 回專案
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flight_smart_monitor.db
          git commit -m "chore: auto-update flight database [skip ci]" || exit 0
          git push
